[project]
name = "vi-websync-workspace"
version = "0.1.0"
description = "VI WebSync industrial AI platform development workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35",
  "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<0.31", "alembic>=1.15,<1.16",
  "celery[redis]>=5.4,<5.6",
  "jsonschema>=4.23,<5", "httpx>=0.28,<0.29"
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = []
testpaths = ['database/tests']

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
