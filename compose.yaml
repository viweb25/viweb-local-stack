name: viweb-local-stack

x-backend: &backend
  image: viweb-local-stack-backend
  build:
    context: ${BACKEND_CONTEXT:-./backend}
    target: base
  init: true

x-database-url: &database-url postgresql+asyncpg://vi:vi_local@postgres:5432/viws

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: vi
      POSTGRES_PASSWORD: vi_local
      POSTGRES_DB: viws
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vi", "-d", "viws"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ${DATABASE_CONTEXT:-./database}
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  inference:
    build:
      context: ${INFERENCE_CONTEXT:-./inference}
      target: ${INFERENCE_TARGET:-default}
    environment:
      VI_TRAINING_RUN_DIR: /var/lib/viweb-training
      VI_YOLO_WEIGHTS: ${VI_YOLO_WEIGHTS:-/models/best.pt}
      VI_DEMO_OLLAMA_URL: ${VI_DEMO_OLLAMA_URL:-http://ollama:11434}
      VI_DEMO_VISION_MODEL: ${VI_DEMO_VISION_MODEL:-qwen2.5vl:3b}
    volumes:
      - ./models:/models:ro
      - training-runs:/var/lib/viweb-training:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    environment:
      DATABASE_URL: *database-url
      REDIS_CACHE_URL: redis://redis:6379/1
      INFERENCE_URL: http://inference:8001
      APP_ORIGIN: http://127.0.0.1:3000
      VI_DEMO_IMAGE_DIR: /var/lib/viweb-demo
      VI_TRAINING_IMAGE_DIR: /var/lib/viweb-demo/training
      VI_TRAINING_RUN_DIR: /var/lib/viweb-training
    volumes:
      - examples:/var/lib/viweb-demo
      - training-runs:/var/lib/viweb-training:ro
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "vi_api.bootstrap:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "worker.app:app", "worker", "--loglevel=info", "--concurrency=2", "--queues=platform"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  training-worker:
    build:
      context: ${INFERENCE_CONTEXT:-./inference}
      target: yolo
    init: true
    restart: unless-stopped
    command: ["python", "-m", "vi_inference.training_worker"]
    environment:
      DATABASE_URL: *database-url
      VI_TRAINING_IMAGE_DIR: /var/lib/viweb-demo/training
      VI_TRAINING_RUN_DIR: /var/lib/viweb-training
      VI_TRAINING_EPOCHS: ${VI_TRAINING_EPOCHS:-20}
    volumes:
      - examples:/var/lib/viweb-demo:ro
      - training-runs:/var/lib/viweb-training
    depends_on:
      migrate:
        condition: service_completed_successfully

  trainer:
    profiles: ["training"]
    build:
      context: ${INFERENCE_CONTEXT:-./inference}
      target: yolo
    user: "${TRAIN_UID:-1000}:${TRAIN_GID:-1000}"
    working_dir: /runs
    environment:
      HOME: /tmp
      YOLO_CONFIG_DIR: /tmp/ultralytics
    volumes:
      - ${DATASET_DIR:-./datasets}:/dataset:ro
      - ./runs:/runs
    entrypoint: ["python", "-m", "vi_inference.train_detector"]

  ollama:
    image: ollama/ollama:0.16.3
    profiles: ["vision"]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama:/root/.ollama

volumes:
  postgres:
  examples:
  training-runs:
  ollama:
